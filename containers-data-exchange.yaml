apiVersion: apps/v1
kind: Deployment
metadata: 
  name: my-app
  labels:
    app: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name:  multitool
        image: wbitt/network-multitool:latest
        ports:
        - containerPort: 80
        volumeMounts:
          - name: host-volume
            mountPath: /home
      - name:  busybox
        image: busybox:latest
        command: ['sh', '-c', 'while true; do date +%s >> /home/sharedfile.txt; sleep 5; done']
        volumeMounts:
          - name: host-volume
            mountPath: /home
      volumes:
        - name: host-volume
          hostPath: 
            path: /tmp